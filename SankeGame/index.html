<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanke Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Scroe:
                        <span id="high scroe">0</span>
                    </h3>
                    
                </div>
                <div class="info">
                    <h3>Scroe:
                        <span id="scroe">0</span>
                    </h3>
                    
                </div>
                <div class="info">
                    <h3>Time:
                        <span id="time">00-00</span>
                    </h3>
                    
                </div>
            </div>
            <div class="board"></div>
        </section>
        <div class="modal">
            <div class="start">
                <h3>welcome to new Game</h3>
                <button class="str-game">start Game</button>
            </div>
        </div>
    </main>
</body>
<script src="app.js"></script>
</html>
